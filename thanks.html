<style>
:root{--navy:#0D2B45;--ink:#0D2B45;--paper:#F4FAF7;--surface:#fff;--emerald:#14A44D;--emerald-d:#0E8A3F;--teal:#0AB3C4;--teal-d:#08808C;--amber:#FFB020;--amber-d:#A56A00;--mint:#DDF5E6;--sky:#DDF4F7;--sun:#FFF1D6;--slate:#4F6273;--line:#D4E3DC;--grad:linear-gradient(120deg,#0AB3C4,#14A44D);--serif:"Spectral",Georgia,"Times New Roman",serif;--sans:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;--r:10px}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#E8F3EE;--paper:#0A1C2B;--surface:#10263A;--emerald:#3DD27A;--emerald-d:#3DD27A;--teal:#2FD0E0;--teal-d:#2FD0E0;--amber-d:#FFB020;--mint:#12352A;--sky:#0F3340;--sun:#3A2E12;--slate:#A5B7C4;--line:#22405A}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:var(--sans);font-size:1.0625rem;line-height:1.6;color:var(--ink);background:var(--paper)}
a{color:inherit}img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:4px}
.wrap{width:min(1160px,100% - 3rem);margin-inline:auto}
.skip{position:absolute;left:-999px;top:0;background:var(--navy);color:#fff;padding:.6rem 1rem;z-index:100}.skip:focus{left:1rem}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2}
h2{font-weight:500;font-size:clamp(1.9rem,4vw,2.75rem);letter-spacing:-.01em;line-height:1.15}
.head{max-width:64ch;margin-bottom:2.5rem}.head p{margin-top:.9rem;color:var(--slate)}
section{padding-block:clamp(3.5rem,8vw,6rem)}
.alt{background:var(--surface);border-block:1px solid var(--line)}

/* header */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:1rem}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none}
.brand img{width:40px;height:40px}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:1.35rem;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-size:.72rem;color:var(--emerald-d);font-weight:600}
.menu{display:flex;align-items:center;gap:1.6rem;list-style:none}
.menu a{text-decoration:none;color:var(--slate);font-weight:500;font-size:.97rem}
.menu a:hover{color:var(--emerald-d)}
.toggle{display:none;background:none;border:1px solid var(--line);border-radius:var(--r);padding:.5rem .8rem;color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.btn{display:inline-block;padding:.82rem 1.45rem;border-radius:var(--r);font-weight:600;text-decoration:none;border:2px solid transparent;font-family:var(--sans);font-size:1rem;cursor:pointer;text-align:center;transition:transform .15s,background .15s}
.btn-primary{background:var(--emerald);color:#fff;box-shadow:0 8px 20px -10px rgba(20,164,77,.8)}
.btn-primary:hover{background:#0E8A3F;transform:translateY(-1px)}
@media (prefers-color-scheme:dark){.btn-primary{color:#0A1C2B}.btn-primary:hover{background:#5BE08F}}
.btn-ghost{color:var(--ink);border-color:var(--ink)}.btn-ghost:hover{background:var(--sky)}
.menu .btn{color:#fff;padding:.58rem 1.05rem}
@media (prefers-color-scheme:dark){.menu .btn{color:#0A1C2B}}

/* hero */
.hero-band{position:relative;overflow:hidden}
.hero-band::before{content:"";position:absolute;right:-12%;top:-30%;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(10,179,196,.22),transparent 65%);pointer-events:none}
.hero-band::after{content:"";position:absolute;left:-12%;bottom:-40%;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(20,164,77,.18),transparent 65%);pointer-events:none}
.hero{position:relative;z-index:1;padding-block:clamp(3rem,7vw,5.5rem);display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:center}
.kicker{font-weight:600;color:var(--emerald-d);font-size:1rem;margin-bottom:1rem}
.hero h1{font-weight:500;font-size:clamp(2.4rem,5.2vw,4.1rem);line-height:1.06;letter-spacing:-.02em;max-width:16ch}
.lede{margin-top:1.3rem;max-width:52ch;font-size:1.18rem;color:var(--slate)}
.actions{margin-top:2rem;display:flex;gap:.9rem;flex-wrap:wrap}
.assure{margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;list-style:none;font-size:.93rem;color:var(--slate)}
.assure li::before{content:"✓ ";color:var(--emerald);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.75rem;box-shadow:0 24px 50px -28px rgba(13,43,69,.45);position:relative}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;border-radius:16px 16px 0 0;background:var(--grad)}
.panel h2{font-family:var(--sans);font-size:1.02rem;font-weight:600;letter-spacing:0;line-height:1.3}
.panel>p{color:var(--slate);font-size:.92rem;margin-top:.2rem}
.meter{display:grid;grid-template-columns:1fr auto;gap:.3rem .75rem;margin-top:1.05rem;font-size:.95rem}
.meter span:last-of-type{color:var(--slate);font-size:.86rem}
.bar{grid-column:1/-1;height:9px;border-radius:99px;background:var(--mint);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:fill 1.2s .3s cubic-bezier(.2,.7,.2,1) both}
.bar .c1{background:var(--teal)}.bar .c2{background:var(--emerald)}.bar .c3{background:var(--amber)}
@keyframes fill{from{transform:scaleX(0)}}
.panel small{display:block;margin-top:1.25rem;color:var(--slate);font-size:.82rem}

/* standards band */
.standards{background:var(--navy);color:#F4FAF7;padding-block:1.6rem}
@media (prefers-color-scheme:dark){.standards{background:#061420}}
.standards .wrap{display:grid;grid-template-columns:auto 1fr;gap:1rem 2.5rem;align-items:center}
.standards h2{font-family:var(--sans);font-size:.98rem;font-weight:500;opacity:.8;letter-spacing:0;line-height:1.4;max-width:16ch}
.std{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;list-style:none}
.std a{display:block;text-decoration:none;padding:.75rem 1rem;border-radius:var(--r);background:rgba(255,255,255,.07);border-left:4px solid var(--teal)}
.std li:nth-child(2) a{border-color:#3DD27A}.std li:nth-child(3) a{border-color:var(--amber)}
.std a:hover{background:rgba(255,255,255,.13)}
.std b{display:block;font-size:1rem}
.std span{display:block;font-size:.84rem;opacity:.75}

/* triggers */
.triggers{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem;list-style:none}
.triggers li{padding:1.4rem;border-radius:var(--r);background:var(--mint)}
.triggers li:nth-child(2){background:var(--sky)}.triggers li:nth-child(3){background:var(--sun)}.triggers li:nth-child(4){background:var(--mint)}
.triggers h3{font-size:1.15rem}
.triggers p{color:var(--slate);font-size:.95rem;margin-top:.4rem}
.triggers a{display:inline-block;margin-top:.8rem;font-weight:600;font-size:.93rem;color:var(--emerald-d)}

/* services */
.practice+.practice{margin-top:4.5rem}
.practice-head{display:grid;grid-template-columns:1fr 1.6fr;gap:2rem;padding-bottom:1.25rem;margin-bottom:1.75rem;align-items:end;border-bottom:3px solid;border-image:var(--grad) 1}
.practice-head h3{font-size:1.7rem}
.practice-head p{color:var(--slate)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--emerald);border-radius:var(--r);padding:1.6rem;display:flex;flex-direction:column}
.card.teal{border-top-color:var(--teal)}.card.amber{border-top-color:var(--amber)}
.tag{align-self:flex-start;font-size:.8rem;font-weight:600;padding:.22rem .65rem;border-radius:99px;margin-bottom:.85rem;background:var(--mint);color:var(--emerald-d)}
.teal .tag{background:var(--sky);color:var(--teal-d)}.amber .tag{background:var(--sun);color:var(--amber-d)}
.card h4{font-size:1.3rem;line-height:1.25}
.card>p{color:var(--slate);margin-top:.5rem;font-size:.98rem}
.card ul{margin-top:1rem;padding-left:1.1rem;font-size:.95rem}
.card li+li{margin-top:.3rem}
.card li::marker{color:var(--emerald)}.teal li::marker{color:var(--teal)}.amber li::marker{color:var(--amber)}
.card .more{margin-top:auto;padding-top:1.25rem;font-weight:600;font-size:.95rem;color:var(--emerald-d);text-decoration:none}
.card .more:hover{text-decoration:underline}
.support{margin-top:1.25rem;display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem;list-style:none}
.support li{border:1px dashed var(--line);border-radius:var(--r);padding:1.1rem 1.2rem}
.support b{display:block;font-family:var(--serif);font-size:1.08rem}
.support span{color:var(--slate);font-size:.92rem}

/* journey */
.split{display:grid;grid-template-columns:1fr 1.4fr;gap:3.5rem;align-items:start}
.journey{list-style:none;counter-reset:j;position:relative}
.journey::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:3px;background:var(--grad);border-radius:3px}
.journey li{counter-increment:j;position:relative;padding:0 0 1.6rem 3.25rem}
.journey li:last-child{padding-bottom:0}
.journey li::before{content:counter(j);position:absolute;left:0;top:0;width:33px;height:33px;border-radius:50%;background:var(--surface);border:3px solid var(--emerald);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--emerald-d)}
.journey h3{font-size:1.2rem}
.journey p{color:var(--slate);font-size:.96rem;margin-top:.2rem}
.journey .who{display:inline-block;margin-top:.35rem;font-size:.8rem;font-weight:600;padding:.12rem .55rem;border-radius:99px;background:var(--sky);color:var(--teal-d)}
.journey .who.cb{background:var(--sun);color:var(--amber-d)}

/* dpdpa */
.oblig{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem 2rem;list-style:none}
.oblig li{padding-left:1rem;border-left:4px solid var(--amber)}
.oblig b{display:block;font-family:var(--serif);font-size:1.12rem}
.oblig span{color:var(--slate);font-size:.95rem}
.callout{margin-top:2.5rem;padding:1.4rem 1.6rem;border-radius:var(--r);background:var(--sun);display:flex;gap:1.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.callout p{max-width:70ch}

/* engagement */
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.model{border:1px solid var(--line);border-radius:var(--r);padding:1.6rem;background:var(--paper)}
.model h3{font-size:1.3rem}
.model .fit{margin-top:.25rem;font-weight:600;font-size:.9rem;color:var(--emerald-d)}
.model p{color:var(--slate);margin-top:.6rem;font-size:.97rem}

/* faq */
.faq{max-width:840px}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:1.15rem 2.5rem 1.15rem 0;font-weight:600;font-size:1.07rem;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:.25rem;top:.85rem;font-size:1.6rem;font-weight:400;color:var(--emerald);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--slate);padding-bottom:1.25rem;max-width:70ch}

/* contact */
#contact{background:var(--navy);color:#F4FAF7;position:relative;overflow:hidden}
@media (prefers-color-scheme:dark){#contact{background:#061420}}
#contact::before{content:"";position:absolute;right:-200px;top:-200px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(20,164,77,.35),transparent 65%);pointer-events:none}
.contact-grid{position:relative;display:grid;grid-template-columns:1fr 1.3fr;gap:3.5rem;align-items:start}
#contact .head p{color:inherit;opacity:.82}
.next{list-style:none;counter-reset:n;display:grid;gap:.9rem;margin-top:1.5rem}
.next li{counter-increment:n;padding-left:2.4rem;position:relative;opacity:.92}
.next li::before{content:counter(n);position:absolute;left:0;top:.05rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#3DD27A;color:#0D2B45;display:grid;place-items:center;font-size:.82rem;font-weight:700}
.direct{margin-top:2rem;opacity:.9}.direct a{color:#7DE3A4;font-weight:600}
form{display:grid;gap:1.1rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:clamp(1.25rem,3vw,2rem)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
label{display:block;font-weight:500;font-size:.93rem;margin-bottom:.35rem}
.opt{opacity:.65;font-weight:400}
input,select,textarea{width:100%;padding:.78rem .9rem;border-radius:var(--r);border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:inherit;font-family:var(--sans);font-size:1rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3DD27A;box-shadow:0 0 0 3px rgba(61,210,122,.35)}
input:user-invalid,textarea:user-invalid{border-color:#FF8F7A}
select option{color:#0D2B45}
textarea{min-height:120px;resize:vertical}
input::placeholder,textarea::placeholder{color:inherit;opacity:.5}
fieldset{border:none}legend{font-weight:500;font-size:.93rem;margin-bottom:.5rem}
.checks{display:flex;flex-wrap:wrap;gap:.5rem}
.checks label{margin:0;display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .85rem;border:1px solid rgba(255,255,255,.28);border-radius:99px;cursor:pointer;font-size:.9rem}
.checks input{width:auto;accent-color:#3DD27A}
.checks label:has(input:checked){background:rgba(61,210,122,.25);border-color:#3DD27A}
#contact .btn-primary{color:#fff}
.note{font-size:.85rem;opacity:.72}
.form-foot{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}

/* footer */
footer{padding-block:2.75rem 2rem;color:var(--slate);font-size:.92rem}
.foot{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:2rem}
.foot .brand{margin-bottom:.8rem;color:var(--ink)}
.foot h3{font-family:var(--sans);font-size:.95rem;font-weight:600;color:var(--ink);margin-bottom:.6rem}
.foot ul{list-style:none;display:grid;gap:.35rem}
.foot a{text-decoration:none}.foot a:hover{color:var(--emerald-d)}
.legal{margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* simple pages */
.simple{min-height:80vh;display:grid;place-items:center;text-align:center;padding:4rem 1.5rem}
.simple img{width:72px;margin-bottom:1.25rem}
.simple h1{font-weight:500;font-size:clamp(2.1rem,5vw,3.2rem)}
.simple p{color:var(--slate);margin:1rem auto 2rem;max-width:46ch}

@media (max-width:1000px){
.hero,.split,.contact-grid{grid-template-columns:1fr}
.split{gap:2rem}.contact-grid{gap:2.5rem}
.grid,.models,.oblig{grid-template-columns:1fr 1fr}
.triggers,.support{grid-template-columns:1fr 1fr}
.practice-head{grid-template-columns:1fr;gap:.6rem}
.standards .wrap{grid-template-columns:1fr}.standards h2{max-width:none}
}
@media (max-width:820px){
.toggle{display:block}
.menu{display:none;position:absolute;top:72px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:var(--paper);border-bottom:1px solid var(--line);padding:.5rem 1.5rem 1.25rem}
.menu.open{display:flex}
.menu a{display:block;padding:.8rem 0;font-size:1.05rem}
.menu .btn{margin-top:.5rem;padding:.85rem}
}
@media (max-width:640px){
.grid,.models,.oblig,.triggers,.support,.std,.row,.foot{grid-template-columns:1fr}
.brand small{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{animation:none}.btn{transition:none}}

</style>
</head>
